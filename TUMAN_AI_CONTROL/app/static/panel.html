<script id="uzbek-national-orthography">(function(){const words=/\b(va|uchun|bilan|hamda|kirish|chiqish|ma'lumot|ma’lumot|o'qituvchi|o‘qituvchi|o'quvchi|o‘quvchi|ta'lim|ta’lim|foydalanuvchi|yordam|sozlamalar|boshqaruv|hisobot|hisobotlar|yuklash|saqlash|o'chirish|o‘chirish|tahrirlash|qidirish|tanlash|bekor|qayta|bajarish|yuborish|ko'rish|ko‘rish|boshlash|yakunlash|muvaffaqiyatli|xatolik|parol|fan|dars|mavzu|resurs|kutubxona|natija|topshiriq|maktab|o'zgartirish|o‘zgartirish)\b/i;function cv(s){if(!words.test(s)&&!/[oOgG][\u2018\u2019\u02BB\u02BC'\u0060]/.test(s))return s;return s.replace(/([oO])[\u2018\u2019\u02BB\u02BC'\u0060´]/g,(_,a)=>a==="O"?"Ö":"ö").replace(/([gG])[\u2018\u2019\u02BB\u02BC'\u0060´]/g,(_,a)=>a==="G"?"Ğ":"ğ").replace(/sh/g,"ş").replace(/Sh/g,"Ş").replace(/SH/g,"Ş").replace(/ch/g,"ç").replace(/Ch/g,"Ç").replace(/CH/g,"Ç")}function walk(n){if(n.nodeType===3){if(!n.parentElement||/^(SCRIPT|STYLE|CODE|PRE|TEXTAREA)$/.test(n.parentElement.tagName))return;const v=cv(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v;return}if(n.nodeType!==1||/^(SCRIPT|STYLE|CODE|PRE|TEXTAREA)$/.test(n.tagName))return;["placeholder","title","aria-label","alt"].forEach(k=>{if(n.hasAttribute(k)){const v=n.getAttribute(k),x=cv(v);if(v!==x)n.setAttribute(k,x)}});n.childNodes.forEach(walk)}function run(){walk(document.body)}if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",run,{once:true});else run();new MutationObserver(rs=>rs.forEach(r=>{r.addedNodes.forEach(walk);if(r.type==="characterData")walk(r.target);if(r.type==="attributes")walk(r.target)})).observe(document.documentElement,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:["placeholder","title","aria-label","alt"]})})();</script></body>
