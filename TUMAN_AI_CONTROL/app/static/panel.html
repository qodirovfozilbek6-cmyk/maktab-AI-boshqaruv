<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#04060c">
<meta name="robots" content="noindex">
<title>MAKTAB AI CONTROL | Panel</title>
<link rel="stylesheet" href="/static/css/maktab.css">
<style>\n.brand-mark { width:52px !important; height:52px !important; object-fit:contain; flex:0 0 52px; background:transparent !important; border:0 !important; box-shadow:none !important; padding:0 !important; }\n.site-footer { margin-top:28px; padding:18px 12px; text-align:center; color:#8793a8; font-size:11px; border-top:1px solid rgba(255,255,255,.09); }\n</style>\n</head>
<body>
<div id="boot" class="boot">YUKLANMOQDA...</div>

<div id="app" class="shell" hidden>
  <aside id="sidebar" class="sidebar">
    <div class="brand">
      <img class="brand-mark" src="/static/maktab-logo.svg" alt="MAKTAB AI CONTROL logosi">
      <div>
        <div class="brand-name">MAKTAB AI CONTROL</div>
        <div class="brand-sub">KELAJAK KENGASHI</div>
      </div>
    </div>
    <nav id="nav" class="nav" aria-label="Asosiy menyu"></nav>
    <div class="side-foot">
      <div class="usercard">
        <div id="userName" class="n"></div>
        <div id="userRole" class="r"></div>
      </div>
      <button id="logoutBtn" class="btn btn-danger" type="button">Chiqish</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button id="menuBtn" class="btn menu-btn" type="button" aria-label="Menyuni ochish">☰</button>
      <div class="grow">
        <h1 id="pageTitle"></h1>
        <div id="pageSub" class="sub"></div>
      </div>
      <span id="roleBadge" class="role-badge"></span>
    </header>
    <div id="notice" role="status" aria-live="polite"></div>
    <section id="view"></section>
    <footer class="site-footer">© <span id="year"></span> MAKTAB AI CONTROL — All Rights Reserved.</footer>
  </main>
</div>

<script>document.getElementById("year").textContent = new Date().getFullYear();</script>
<script src="/static/js/panel.js"></script>
</body>
</html>
