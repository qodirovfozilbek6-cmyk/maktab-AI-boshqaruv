
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#04060c">
<meta name="robots" content="noindex">

<title>MAKTAB AI CONTROL | Kirish</title>

<link rel="stylesheet" href="/static/css/maktab.css">

<style>
.brand-logo { width:48px; height:48px; flex:0 0 48px; object-fit:contain; filter:drop-shadow(0 0 12px rgba(233,196,106,.18)); }

/* PAROL MAYDONI JOYLASHUVI */
.pw-row {
    position: relative;
    display: block;
    width: 100%;
}

.pw-row .input {
    display: block;
    width: 100%;
    box-sizing: border-box;
    padding-right: 100px !important;
}

.pw-row .toggle {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 5;

    width: auto;
    min-width: 65px;
    margin: 0;
    padding: 7px 10px;

    white-space: nowrap;
    cursor: pointer;
}

/* Mobil ekranlar */
@media (max-width: 480px) {
    .pw-row .input {
        padding-right: 90px !important;
    }

    .pw-row .toggle {
        right: 7px;
        min-width: 60px;
        padding: 6px 8px;
    }
}
</style>
</head>

<body>

<div class="auth-wrap">

<form id="loginForm" class="card auth-card"
      autocomplete="on" novalidate>

    <!-- BREND -->
    <div class="brand">
        <img class="brand-logo" src="/static/maktab-logo.svg" alt="MAKTAB AI CONTROL logosi">
        <div>
            <div class="brand-name">MAKTAB AI CONTROL</div>
            <div class="brand-sub">KELAJAK KENGASHI</div>
        </div>
    </div>

    <h1>Tizimga kirish</h1>
    <p class="lead">
        Rolingizga mos panel avtomatik ochiladi.
    </p>

    <!-- XATOLIK -->
    <div id="error" class="notice err"
         role="alert" hidden></div>

    <!-- LOGIN -->
    <div class="field">
        <label for="username">Login</label>

        <input
            id="username"
            class="input"
            name="username"
            type="text"
            autocomplete="username"
            autocapitalize="none"
            spellcheck="false"
            required
        >
    </div>

    <!-- PAROL -->
    <div class="field">
        <label for="password">Parol</label>

        <div class="pw-row">

            <input
                id="password"
                class="input"
                name="password"
                type="password"
                autocomplete="current-password"
                required
            >

            <button
                id="togglePw"
                class="btn btn-sm toggle"
                type="button"
                aria-label="Parolni ko'rsatish"
                aria-pressed="false"
            >Ko'rsat</button>

        </div>
    </div>

    <!-- KIRISH -->
    <button
        id="submitBtn"
        class="btn btn-primary"
        type="submit"
    >
        Xavfsiz kirish →
    </button>

</form>
</div>

<script>
(function () {

    "use strict";

    var TOKEN_KEY = "maktab_token";
    var LEGACY_KEY = "tuman_admin_token";

    var form = document.getElementById("loginForm");
    var errorBox = document.getElementById("error");
    var button = document.getElementById("submitBtn");
    var pw = document.getElementById("password");
    var toggle = document.getElementById("togglePw");

    // PAROLNI KO'RSATISH / YASHIRISH
    toggle.addEventListener("click", function () {

        var show = pw.type === "password";

        pw.type = show ? "text" : "password";

        this.textContent = show ? "Yashir" : "Ko'rsat";

        this.setAttribute("aria-label",
            show ? "Parolni yashirish" : "Parolni ko'rsatish"
        );

        this.setAttribute("aria-pressed", String(show));

    });

    // XATOLIKNI KO'RSATISH
    function showError(message) {

        errorBox.textContent = message;
        errorBox.hidden = false;

    }

    // OLDINDAN KIRGAN FOYDALANUVCHI
    if (localStorage.getItem(TOKEN_KEY)) {

        window.location.replace("/panel");
        return;

    }

    // LOGIN JARAYONI
    form.addEventListener("submit", async function (event) {

        event.preventDefault();

        errorBox.hidden = true;

        var username = document
            .getElementById("username")
            .value.trim();

        if (!username || !pw.value) {

            showError("Login va parolni kiriting.");
            return;

        }

        button.disabled = true;
        button.textContent = "Tekshirilmoqda...";

        try {

            var body = new URLSearchParams();

            body.set("username", username);
            body.set("password", pw.value);

            var response = await fetch("/auth/login", {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/x-www-form-urlencoded"
                },

                body: body.toString()

            });

            // SO'ROVLAR LIMITI
            if (response.status === 429) {

                var limited = {};

                try {
                    limited = await response.json();
                } catch (e) {}

                throw new Error(
                    limited.detail ||
                    "Juda ko'p urinish. Birozdan keyin qayta urinib ko'ring."
                );

            }

            // NOTO'G'RI LOGIN YOKI PAROL
            if (response.status === 401) {

                throw new Error(
                    "Login yoki parol noto'g'ri."
                );

            }

            if (!response.ok) {

                throw new Error(
                    "Kirish amalga oshmadi (HTTP " +
                    response.status + ")."
                );

            }

            // TOKENNI OLISH
            var data = await response.json();

            if (!data.access_token) {

                throw new Error(
                    "Server token qaytarmadi."
                );

            }

            // FOYDALANUVCHINI TEKSHIRISH
            var meResponse = await fetch("/auth/me", {

                headers: {
                    "Authorization":
                        "Bearer " + data.access_token
                }

            });

            if (!meResponse.ok) {

                throw new Error(
                    "Foydalanuvchi ma'lumotini tekshirib bo'lmadi."
                );

            }

            var user = await meResponse.json();

            // TOKENNI SAQLASH
            localStorage.setItem(
                TOKEN_KEY,
                data.access_token
            );

            // ADMIN ESKI TIZIMI BILAN MOSLIK
            if (user.role === "admin") {

                localStorage.setItem(
                    LEGACY_KEY,
                    data.access_token
                );

            } else {

                localStorage.removeItem(LEGACY_KEY);

            }

            // PAROLNI TOZALASH
            pw.value = "";

            // PANELGA YO'NALTIRISH
            window.location.replace("/panel");

        } catch (error) {

            showError(
                error.message ||
                "Ulanishda xatolik yuz berdi."
            );

        } finally {

            button.disabled = false;
            button.textContent = "Xavfsiz kirish →";

        }

    });

})();
</script>

</body>
</html>
